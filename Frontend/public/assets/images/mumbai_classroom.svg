<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <!-- Background with light rounded border matching the Kolkata card template -->
  <rect x="2" y="2" width="996" height="416" rx="36" fill="#ffffff" stroke="#e0e0e0" stroke-width="3" />
  
  <!-- Ground Line -->
  <line x1="40" y1="390" x2="960" y2="390" stroke="#8e8e8e" stroke-width="1.5" />

  <!-- 1. Chhatrapati Shivaji Maharaj Terminus (CSMT) - Left Landmark -->
  <g transform="translate(60, 240)">
    <!-- Base Structure -->
    <rect x="0" y="100" width="160" height="50" fill="none" stroke="#8e8e8e" stroke-width="1.5" />
    <rect x="15" y="60" width="130" height="40" fill="none" stroke="#8e8e8e" stroke-width="1.5" />
    
    <!-- Central Tower and Dome -->
    <rect x="60" y="25" width="40" height="35" fill="none" stroke="#8e8e8e" stroke-width="1.5" />
    <path d="M60,25 C60,-5 100,-5 100,25 Z" fill="none" stroke="#8e8e8e" stroke-width="1.5" />
    <line x1="80" y1="-2" x2="80" y2="-12" stroke="#8e8e8e" stroke-width="1.5" />
    <circle cx="80" cy="-14" r="2" fill="none" stroke="#8e8e8e" stroke-width="1.2" />

    <!-- Corner Turrets & Pinnacles -->
    <line x1="15" y1="60" x2="15" y2="40" stroke="#8e8e8e" stroke-width="1.5" />
    <path d="M12,40 L18,40 L15,32 Z" fill="none" stroke="#8e8e8e" stroke-width="1.2" />
    <line x1="145" y1="60" x2="145" y2="40" stroke="#8e8e8e" stroke-width="1.5" />
    <path d="M142,40 L148,40 L145,32 Z" fill="none" stroke="#8e8e8e" stroke-width="1.2" />
    
    <line x1="0" y1="100" x2="0" y2="85" stroke="#8e8e8e" stroke-width="1.5" />
    <line x1="160" y1="100" x2="160" y2="85" stroke="#8e8e8e" stroke-width="1.5" />

    <!-- Arched Windows - Lower Tier -->
    <path d="M15,130 C15,115 30,115 30,130" fill="none" stroke="#8e8e8e" stroke-width="1.2" />
    <path d="M40,130 C40,115 55,115 55,130" fill="none" stroke="#8e8e8e" stroke-width="1.2" />
    <path d="M65,130 C65,115 80,115 80,130" fill="none" stroke="#8e8e8e" stroke-width="1.2" />
    <path d="M80,130 C80,115 95,115 95,130" fill="none" stroke="#8e8e8e" stroke-width="1.2" />
    <path d="M105,130 C105,115 120,115 120,130" fill="none" stroke="#8e8e8e" stroke-width="1.2" />
    <path d="M130,130 C130,115 145,115 145,130" fill="none" stroke="#8e8e8e" stroke-width="1.2" />

    <!-- Arched Windows - Upper Tier -->
    <path d="M25,85 C25,75 35,75 35,85" fill="none" stroke="#8e8e8e" stroke-width="1.2" />
    <path d="M50,85 C50,75 60,75 60,85" fill="none" stroke="#8e8e8e" stroke-width="1.2" />
    <path d="M100,85 C100,75 110,75 110,85" fill="none" stroke="#8e8e8e" stroke-width="1.2" />
    <path d="M125,85 C125,75 135,75 135,85" fill="none" stroke="#8e8e8e" stroke-width="1.2" />
    
    <!-- Central Window -->
    <circle cx="80" cy="45" r="8" fill="none" stroke="#8e8e8e" stroke-width="1.2" />
  </g>

  <!-- 2. Bandra-Worli Sea Link - Middle Landmark (Span: 280 to 700) -->
  <g transform="translate(280, 160)">
    <!-- Bridge Piers -->
    <line x1="20" y1="220" x2="20" y2="230" stroke="#8e8e8e" stroke-width="1.5" />
    <line x1="60" y1="220" x2="60" y2="230" stroke="#8e8e8e" stroke-width="1.5" />
    <line x1="100" y1="220" x2="100" y2="230" stroke="#8e8e8e" stroke-width="1.5" />
    <line x1="320" y1="220" x2="320" y2="230" stroke="#8e8e8e" stroke-width="1.5" />
    <line x1="360" y1="220" x2="360" y2="230" stroke="#8e8e8e" stroke-width="1.5" />
    <line x1="400" y1="220" x2="400" y2="230" stroke="#8e8e8e" stroke-width="1.5" />
    
    <!-- Bridge Decks -->
    <path d="M0,222 L420,222" stroke="#8e8e8e" stroke-width="2.5" />
    <path d="M0,226 L420,226" stroke="#8e8e8e" stroke-width="1.2" />

    <!-- Left Main Pylon -->
    <path d="M125,230 L152,90 L168,90 L195,230" fill="none" stroke="#8e8e8e" stroke-width="2.5" />
    <line x1="160" y1="90" x2="160" y2="230" stroke="#8e8e8e" stroke-width="1.5" />
    <!-- Cable-stay lines for Left Pylon -->
    <line x1="160" y1="105" x2="60" y2="222" stroke="#8e8e8e" stroke-width="0.8" />
    <line x1="160" y1="120" x2="80" y2="222" stroke="#8e8e8e" stroke-width="0.8" />
    <line x1="160" y1="135" x2="100" y2="222" stroke="#8e8e8e" stroke-width="0.8" />
    <line x1="160" y1="150" x2="120" y2="222" stroke="#8e8e8e" stroke-width="0.8" />
    <line x1="160" y1="165" x2="140" y2="222" stroke="#8e8e8e" stroke-width="0.8" />

    <line x1="160" y1="105" x2="260" y2="222" stroke="#8e8e8e" stroke-width="0.8" />
    <line x1="160" y1="120" x2="240" y2="222" stroke="#8e8e8e" stroke-width="0.8" />
    <line x1="160" y1="135" x2="220" y2="222" stroke="#8e8e8e" stroke-width="0.8" />
    <line x1="160" y1="150" x2="200" y2="222" stroke="#8e8e8e" stroke-width="0.8" />
    <line x1="160" y1="165" x2="180" y2="222" stroke="#8e8e8e" stroke-width="0.8" />

    <!-- Right Main Pylon -->
    <path d="M225,230 L252,90 L268,90 L295,230" fill="none" stroke="#8e8e8e" stroke-width="2.5" />
    <line x1="260" y1="90" x2="260" y2="230" stroke="#8e8e8e" stroke-width="1.5" />
    <!-- Cable-stay lines for Right Pylon -->
    <line x1="260" y1="105" x2="160" y2="222" stroke="#8e8e8e" stroke-width="0.8" />
    <line x1="260" y1="120" x2="180" y2="222" stroke="#8e8e8e" stroke-width="0.8" />
    <line x1="260" y1="135" x2="200" y2="222" stroke="#8e8e8e" stroke-width="0.8" />
    <line x1="260" y1="150" x2="220" y2="222" stroke="#8e8e8e" stroke-width="0.8" />
    <line x1="260" y1="165" x2="240" y2="222" stroke="#8e8e8e" stroke-width="0.8" />

    <line x1="260" y1="105" x2="360" y2="222" stroke="#8e8e8e" stroke-width="0.8" />
    <line x1="260" y1="120" x2="340" y2="222" stroke="#8e8e8e" stroke-width="0.8" />
    <line x1="260" y1="135" x2="320" y2="222" stroke="#8e8e8e" stroke-width="0.8" />
    <line x1="260" y1="150" x2="300" y2="222" stroke="#8e8e8e" stroke-width="0.8" />
    <line x1="260" y1="165" x2="280" y2="222" stroke="#8e8e8e" stroke-width="0.8" />
  </g>

  <!-- 3. Gateway of India - Right Landmark -->
  <g transform="translate(770, 240)">
    <!-- Base structure blocks -->
    <path d="M0,150 L0,50 L20,50 L20,15" fill="none" stroke="#8e8e8e" stroke-width="1.5" />
    <path d="M20,15 L40,15 L40,50 L130,50 L130,15 L150,15 L150,50 L170,50 L170,150 Z" fill="none" stroke="#8e8e8e" stroke-width="1.5" />
    
    <!-- Central Dome structure -->
    <path d="M45,50 C45,18 125,18 125,50 Z" fill="none" stroke="#8e8e8e" stroke-width="1.8" />
    <path d="M55,50 C55,28 115,28 115,50 Z" fill="none" stroke="#8e8e8e" stroke-width="1.0" />
    
    <!-- Side pinnacles / minarets -->
    <line x1="10" y1="50" x2="10" y2="25" stroke="#8e8e8e" stroke-width="1.5" />
    <circle cx="10" cy="22" r="3" fill="none" stroke="#8e8e8e" stroke-width="1.2" />
    
    <line x1="160" y1="50" x2="160" y2="25" stroke="#8e8e8e" stroke-width="1.5" />
    <circle cx="160" cy="22" r="3" fill="none" stroke="#8e8e8e" stroke-width="1.2" />
    
    <line x1="50" y1="50" x2="50" y2="20" stroke="#8e8e8e" stroke-width="1.2" />
    <line x1="120" y1="50" x2="120" y2="20" stroke="#8e8e8e" stroke-width="1.2" />

    <!-- Central Grand Archway -->
    <path d="M45,150 L45,95 C45,62 125,62 125,95 L125,150" fill="none" stroke="#8e8e8e" stroke-width="2.0" />
    <path d="M52,150 L52,100 C52,72 118,72 118,100 L118,150" fill="none" stroke="#8e8e8e" stroke-width="1.0" />
    
    <!-- Left Arched Passage -->
    <path d="M12,150 L12,110 C12,98 32,98 32,110 L32,150" fill="none" stroke="#8e8e8e" stroke-width="1.5" />
    
    <!-- Right Arched Passage -->
    <path d="M138,150 L138,110 C138,98 158,98 158,110 L158,150" fill="none" stroke="#8e8e8e" stroke-width="1.5" />
    
    <!-- Top Details -->
    <line x1="20" y1="15" x2="20" y2="10" stroke="#8e8e8e" stroke-width="1.5" />
    <line x1="40" y1="15" x2="40" y2="10" stroke="#8e8e8e" stroke-width="1.5" />
    <line x1="130" y1="15" x2="130" y2="10" stroke="#8e8e8e" stroke-width="1.5" />
    <line x1="150" y1="15" x2="150" y2="10" stroke="#8e8e8e" stroke-width="1.5" />
  </g>
</svg>
